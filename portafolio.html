<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IPE3 | Portafolio CCTV</title>
  <style>
    :root{
      --bg:#071724;
      --bg2:#0f2337;
      --card:#112a3f;
      --line:#243d54;
      --text:#edf6ff;
      --muted:#9eb9d3;
      --green:#3fe0a4;
      --green2:#27c996;
      --blue:#29b7d9;
      --danger:#ff7b7b;
    }

    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    body{
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
    }

    .container{
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    h1{
      margin: 0 0 18px;
      font-size: 2rem;
      font-weight: 700;
    }

    .toolbar{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap:12px;
      margin-bottom:18px;
    }

    select,input,button{
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid var(--line);
      background:#0d1f2e;
      color:var(--text);
      font-size:14px;
    }

    button{
      cursor:pointer;
      font-weight:700;
      background:linear-gradient(135deg, var(--green), var(--green2));
      color:#062a1f;
      border:none;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap:18px;
    }

    .card{
      background: rgba(17,34,50,.92);
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      box-shadow:0 10px 24px rgba(0,0,0,.18);
    }

    .card img{
      width:100%;
      height:180px;
      object-fit:cover;
      display:block;
      background:#f3f7fb;
      border-radius:10px;
      margin-bottom:10px;
    }

    .meta{
      color:var(--muted);
      font-size:12px;
      margin-bottom:8px;
    }

    .name{
      font-size:18px;
      line-height:1.2;
      font-weight:700;
      min-height:52px;
      margin-bottom:8px;
    }

    .code{
      font-size:12px;
      color:#9ad8ff;
      margin-bottom:8px;
    }

    .desc{
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
      min-height:72px;
      margin-bottom:10px;
    }

    .price{
      font-size:28px;
      font-weight:800;
      color:var(--green);
      margin:12px 0 4px;
    }

    .small{
      color:var(--muted);
      font-size:12px;
    }

    .row{
      display:flex;
      gap:8px;
      margin-top:14px;
    }

    .row button{
      flex:1;
    }

    .empty{
      padding:30px;
      text-align:center;
      color:var(--muted);
      border:1px dashed var(--line);
      border-radius:12px;
      background:rgba(255,255,255,.02);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Catálogo IPE3</h1>

    <div class="toolbar">
      <div>
        <label for="categoryFilter">Categoría</label>
        <select id="categoryFilter"></select>
      </div>
      <div>
        <label for="brandFilter">Marca</label>
        <select id="brandFilter"></select>
      </div>
      <div>
        <label for="resolutionFilter">Resolución</label>
        <select id="resolutionFilter"></select>
      </div>
      <div>
        <label for="searchInput">Buscar</label>
        <input id="searchInput" type="text" placeholder="Ej: Dahua, 4MP, dashcam" />
      </div>
    </div>

    <div id="catalog" class="grid"></div>
  </div>

  <script>
    const PRICE_INCREASE = 20;

    const products = [
      {
        category: "Camaras Para Autos Buses",
        brand: "Dahua",
        resolution: "4MP",
        code: "CAM-001",
        name: "Dash Cam S6",
        cost: 48.33,
        stock: "Disponible",
        crop: "center 35%",
        img: "./static/products/real/camaras-para-autos-buses/dashcam-aiteck-1.jpeg",
        description: "Dash cam profesional para autos y buses, grabación 4MP."
      },
      {
        category: "Camaras Para Autos Buses",
        brand: "Dahua",
        resolution: "4MP",
        code: "CAM-002",
        name: "Cámara Tablero",
        cost: 58.00,
        stock: "Disponible",
        crop: "center 55%",
        img: "./static/products/real/camaras-para-autos-buses/camara-tablero-dist-2.png",
        description: "Cámara de tablero para buses con visión clara."
      },
      {
        category: "Camaras Para Autos Buses",
        brand: "Dahua",
        resolution: "4MP",
        code: "CAM-003",
        name: "MVDR Dahua 1",
        cost: 82.50,
        stock: "Pedido",
        crop: "center 40%",
        img: "./static/products/real/camaras-para-autos-buses/mvdr-dahua-dist-1.png",
        description: "Modelo de grabación para flota con visión frontal clara."
      },
      {
        category: "Camaras Para Autos Buses",
        brand: "Dahua",
        resolution: "4MP",
        code: "CAM-004",
        name: "MVDR Dahua 2",
        cost: 96.20,
        stock: "Disponible",
        crop: "center 45%",
        img: "./static/products/real/camaras-para-autos-buses/mvdr-dahua-dist-2.jpeg",
        description: "Versión de flota para circulación continua."
      },
      {
        category: "Acceso Vehicular",
        brand: "Dahua",
        code: "ACC-001",
        name: "Barrera Vehicular Dahua 2",
        resolution: "4MP",
        cost: 121.00,
        stock: "Disponible",
        crop: "center 52%",
        img: "./static/products/real/acceso-vehicular/barrera-vehicular-dahua-2.jpeg",
        description: "Control vehicular con tecnología profesional."
      },
      {
        category: "Acceso Vehicular",
        brand: "Hikvision",
        resolution: "4MP",
        code: "ACC-002",
        name: "Barrera Vehicular Hikvision",
        cost: 137.00,
        stock: "Disponible",
        crop: "center 50%",
        img: "./static/products/real/acceso-vehicular/barrera-vehicular-hikvision.jpeg",
        description: "Solución robusta para control de acceso vehicular."
      },
      {
        category: "Alarmas Hogar",
        brand: "Hikvision",
        resolution: "2MP",
        code: "ALM-001",
        name: "Alarma G20",
        cost: 65.00,
        stock: "Disponible",
        crop: "center 30%",
        img: "./static/products/real/alarmas-hogar/alarma-g20-dist.jpeg",
        description: "Panel de alarma para vivienda con control remoto."
      },
      {
        category: "Alarmas Hogar",
        brand: "Hikvision",
        resolution: "2MP",
        code: "ALM-002",
        name: "Alarma GSM 1 Instalado",
        cost: 78.00,
        stock: "Disponible",
        crop: "center 35%",
        img: "./static/products/real/alarmas-hogar/alarma-gsm-1-instalado-dist.png",
        description: "Sistema con instalación y conectividad GSM."
      }
    ];

    const state = {
      category: "",
      brand: "",
      resolution: "",
      query: ""
    };

    function money(v){
      return "$" + Number(v || 0).toFixed(2);
    }

    function priceWithIncrease(v){
      return Number((Number(v) * (100 + PRICE_INCREASE) / 100).toFixed(2));
    }

    function unique(values){
      return [...new Set(values)].sort();
    }

    function renderFilters(){
      const categories = unique(products.map(p => p.category));
      const brands = unique(products
        .filter(p => !state.category || p.category === state.category)
        .map(p => p.brand));
      const resolutions = unique(products
        .filter(p => (!state.category || p.category === state.category) &&
                     (!state.brand || p.brand === state.brand))
        .map(p => p.resolution));

      const categorySelect = document.getElementById("categoryFilter");
      const brandSelect = document.getElementById("brandFilter");
      const resolutionSelect = document.getElementById("resolutionFilter");

      categorySelect.innerHTML = [
        '<option value="">Todas</option>',
        ...categories.map(c => `<option value="${c}">${c}</option>`)
      ].join("");

      brandSelect.innerHTML = [
        '<option value="">Todas</option>',
        ...brands.map(b => `<option value="${b}">${b}</option>`)
      ].join("");

      resolutionSelect.innerHTML = [
        '<option value="">Todas</option>',
        ...resolutions.map(r => `<option value="${r}">${r}</option>`)
      ].join("");

      categorySelect.value = state.category;
      brandSelect.value = state.brand;
      resolutionSelect.value = state.resolution;
    }

    function filterProducts(){
      return products.filter(p => {
        const query = state.query.toLowerCase();
        const haystack = `${p.name} ${p.category} ${p.brand} ${p.description} ${p.code}`.toLowerCase();

        return (
          (!state.category || p.category === state.category) &&
          (!state.brand || p.brand === state.brand) &&
          (!state.resolution || p.resolution === state.resolution) &&
          (!query || haystack.includes(query))
        );
      });
    }

    function renderCatalog(){
      const catalogEl = document.getElementById("catalog");
      const rows = filterProducts();

      if (!rows.length) {
        catalogEl.innerHTML = '<div class="empty">Sin coincidencias.</div>';
        return;
      }

      catalogEl.innerHTML = rows.map(p => `
        <article class="card">
          <img
            src="${p.img}"
            alt="${p.name}"
            style="object-position:${p.crop || 'center'};"
          />
          <div class="meta">${p.category} · ${p.brand}</div>
          <div class="name">${p.name}</div>
          <div class="code">Código: ${p.code}</div>
          <div class="desc">${p.description}</div>
          <div class="small">Stock: ${p.stock}</div>
          <div class="price">${money(priceWithIncrease(p.cost))}</div>
          <div class="small">Precio de venta + IVA</div>
          <div class="row">
            <button type="button">Ficha</button>
            <button type="button">Añadir</button>
          </div>
        </article>
      `).join("");
    }

    document.getElementById("categoryFilter").addEventListener("change", (e) => {
      state.category = e.target.value;
      state.brand = "";
      state.resolution = "";
      renderFilters();
      renderCatalog();
    });

    document.getElementById("brandFilter").addEventListener("change", (e) => {
      state.brand = e.target.value;
      state.resolution = "";
      renderFilters();
      renderCatalog();
    });

    document.getElementById("resolutionFilter").addEventListener("change", (e) => {
      state.resolution = e.target.value;
      renderCatalog();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      state.query = e.target.value;
      renderCatalog();
    });

    renderFilters();
    renderCatalog();
  </script>
</body>
</html>
