  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Portafolio de CCTV | IPE3 Engineering",
    "description": "Portafolio de proyectos de CCTV y seguridad electrónica en Quito, Ecuador.",
    "url": "https://ipe3ec.github.io/engineering/portafolio.html"
  }

  <link rel="canonical" href="https://ipe3ec.github.io/engineering/portafolio.html" />
  <link rel="stylesheet" href="./static/css/ipe3-theme.css?v=alma-dust-20261118">
  <link rel="stylesheet" href="./static/css/ipe3-apple-animations.css?v=1">
  <script src="./static/js/ipe3-header-stars.js?v=alma-dust-20261118" defer></script>
  <script src="./static/js/ipe3-apple-animations.js?v=1" defer></script>
  <style>
    :root{
      --bg:#071724;
      --bg2:#0f2337;
      --card:#112a3f;
      --line:#243d54;
      --text:#edf6ff;
      --muted:#9eb9d3;
      --green:#3fe0a4;
      --green2:#27c996;
      --blue:#29b7d9;
      --danger:#ff7b7b;
    }

    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    body{
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
    }

    .container{
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    h1{
      margin: 0 0 18px;
      font-size: 2rem;
      font-weight: 700;
    }

    .toolbar{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap:12px;
      margin-bottom:18px;
    }

    select,input,button{
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid var(--line);
      background:#0d1f2e;
      color:var(--text);
      font-size:14px;
    }

    button{
      cursor:pointer;
      font-weight:700;
      background:linear-gradient(135deg, var(--green), var(--green2));
      color:#062a1f;
      border:none;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap:18px;
    }

    .card{
      background: rgba(17,34,50,.92);
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      box-shadow:0 10px 24px rgba(0,0,0,.18);
    }

    .card-media{
      position:relative;
      height:180px;
      border-radius:10px;
      overflow:hidden;
      margin-bottom:10px;
      background:linear-gradient(135deg,#16344b,#0d1f2e);
    }

    .card-media img{
      position:relative;
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .card-media span{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color:#7fa8c9;
      font-size:12px;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .card-media.is-missing img{
      display:none;
    }

    .meta{
      color:var(--muted);
      font-size:12px;
      margin-bottom:8px;
    }

    .name{
      font-size:18px;
      line-height:1.2;
      font-weight:700;
      min-height:52px;
      margin-bottom:8px;
    }

    .code{
      font-size:12px;
      color:#9ad8ff;
      margin-bottom:8px;
    }

    .desc{
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
      min-height:72px;
      margin-bottom:10px;
    }

    .price{
      font-size:28px;
      font-weight:800;
      color:var(--green);
      margin:12px 0 4px;
    }

    .small{
      color:var(--muted);
      font-size:12px;
    }

    .row{
      display:flex;
      gap:8px;
      margin-top:14px;
    }

    .row button{
      flex:1;
    }

    .empty{
      padding:30px;
      text-align:center;
      color:var(--muted);
      border:1px dashed var(--line);
      border-radius:12px;
      background:rgba(255,255,255,.02);
    }
  </style>
</head>
<body>
  <header class="ipe3-header">
    <div class="ipe3-header-stars" id="header-stars" aria-hidden="true"></div>
    <div class="ipe3-header-inner">
      <a class="ipe3-brand" href="./index.html" aria-label="IPE3 Engineering, inicio">
        <img class="ipe3-brand-logo" src="./static/img/ipe3-logo.png" alt="Logo IPE3 Engineering" width="72" height="72">
        <span class="ipe3-brand-copy">
          <strong class="ipe3-brand-name">IPE3® <span>Engineering</span></strong>
          <small class="ipe3-brand-tagline">BY CORPORACIÓN 360</small>
        </span>
      </a>
      <nav class="ipe3-nav" aria-label="Navegación principal">
        <a href="./index.html">Inicio</a>
        <a href="./servicios.html">Servicios</a>
        <a href="./proyectos.html">Proyectos</a>
        <a href="./portafolio.html" aria-current="page">Catálogo</a>
        <a href="./nosotros.html">Nosotros</a>
        <a href="./recompensas.html">Recompensas</a>
        <a href="./index.html#contacto">Contacto</a>
      </nav>
      <a class="ipe3-header-cta" href="https://wa.me/593984016027" target="_blank" rel="noopener">Cotizar</a>
    </div>
  </header>
  <div class="container">
    <h1>Catálogo IPE3</h1>

    <div class="toolbar">
      <div>
        <label for="categoryFilter">Categoría</label>
        <select id="categoryFilter"></select>
      </div>
      <div>
        <label for="brandFilter">Marca</label>
        <select id="brandFilter"></select>
      </div>
      <div>
        <label for="resolutionFilter">Resolución</label>
        <select id="resolutionFilter"></select>
      </div>
      <div>
        <label for="searchInput">Buscar</label>
        <input id="searchInput" type="text" placeholder="Ej: Dahua, 4MP, dashcam" />
      </div>
    </div>

    <div id="catalog" class="grid"></div>
  </div>

  <script>
    const PRICE_INCREASE = 20;

    const products = [
      {
        category: "Camaras Para Autos Buses",
        brand: "Dahua",
        resolution: "4MP",
        code: "CAM-001",
        name: "Dash Cam S6",
        cost: 48.33,
        stock: "Disponible",
        crop: "center 35%",
        img: "./static/products/real/camaras-para-autos-buses/dashcam-aiteck-1.jpeg",
        description: "Dash cam profesional para autos y buses, grabación 4MP."
      },
      {
        category: "Camaras Para Autos Buses",
        brand: "Dahua",
        resolution: "4MP",
        code: "CAM-002",
        name: "Cámara Tablero",
        cost: 58.00,
        stock: "Disponible",
        crop: "center 55%",
        img: "./static/products/real/camaras-para-autos-buses/camara-tablero-dist-2.png",
        description: "Cámara de tablero para buses con visión clara."
      },
      {
        category: "Camaras Para Autos Buses",
        brand: "Dahua",
        resolution: "4MP",
        code: "CAM-003",
        name: "MVDR Dahua 1",
        cost: 82.50,
        stock: "Pedido",
        crop: "center 40%",
        img: "./static/products/real/camaras-para-autos-buses/mvdr-dahua-dist-1.png",
        description: "Modelo de grabación para flota con visión frontal clara."
      },
      {
        category: "Camaras Para Autos Buses",
        brand: "Dahua",
        resolution: "4MP",
        code: "CAM-004",
        name: "MVDR Dahua 2",
        cost: 96.20,
        stock: "Disponible",
        crop: "center 45%",
        img: "./static/products/real/camaras-para-autos-buses/mvdr-dahua-dist-2.jpeg",
        description: "Versión de flota para circulación continua."
      },
      {
        category: "Acceso Vehicular",
        brand: "Dahua",
        code: "ACC-001",
        name: "Barrera Vehicular Dahua 2",
        resolution: "4MP",
        cost: 121.00,
        stock: "Disponible",
        crop: "center 52%",
        img: "./static/products/real/acceso-vehicular/barrera-vehicular-dahua-2.jpeg",
        description: "Control vehicular con tecnología profesional."
      },
      {
        category: "Acceso Vehicular",
        brand: "Hikvision",
        resolution: "4MP",
        code: "ACC-002",
        name: "Barrera Vehicular Hikvision",
        cost: 137.00,
        stock: "Disponible",
        crop: "center 50%",
        img: "./static/products/real/acceso-vehicular/barrera-vehicular-hikvision.jpeg",
        description: "Solución robusta para control de acceso vehicular."
      },
      {
        category: "Alarmas Hogar",
        brand: "Hikvision",
        resolution: "2MP",
        code: "ALM-001",
        name: "Alarma G20",
        cost: 65.00,
        stock: "Disponible",
        crop: "center 30%",
        img: "./static/products/real/alarmas-hogar/alarma-g20-dist.jpeg",
        description: "Panel de alarma para vivienda con control remoto."
      },
      {
        category: "Alarmas Hogar",
        brand: "Hikvision",
        resolution: "2MP",
        code: "ALM-002",
        name: "Alarma GSM 1 Instalado",
        cost: 78.00,
        stock: "Disponible",
        crop: "center 35%",
        img: "./static/products/real/alarmas-hogar/alarma-gsm-1-instalado-dist.png",
        description: "Sistema con instalación y conectividad GSM."
      }
    ];

    const state = {
      category: "",
      brand: "",
      resolution: "",
      query: ""
    };

    function money(v){
      return "$" + Number(v || 0).toFixed(2);
    }

    function priceWithIncrease(v){
      return Number((Number(v) * (100 + PRICE_INCREASE) / 100).toFixed(2));
    }

    function unique(values){
      return [...new Set(values)].sort();
    }

    function renderFilters(){
      const categories = unique(products.map(p => p.category));
      const brands = unique(products
        .filter(p => !state.category || p.category === state.category)
        .map(p => p.brand));
      const resolutions = unique(products
        .filter(p => (!state.category || p.category === state.category) &&
                     (!state.brand || p.brand === state.brand))
        .map(p => p.resolution));

      const categorySelect = document.getElementById("categoryFilter");
      const brandSelect = document.getElementById("brandFilter");
      const resolutionSelect = document.getElementById("resolutionFilter");

      categorySelect.innerHTML = [
        '<option value="">Todas</option>',
        ...categories.map(c => `<option value="${c}">${c}</option>`)
      ].join("");

      brandSelect.innerHTML = [
        '<option value="">Todas</option>',
        ...brands.map(b => `<option value="${b}">${b}</option>`)
      ].join("");

      resolutionSelect.innerHTML = [
        '<option value="">Todas</option>',
        ...resolutions.map(r => `<option value="${r}">${r}</option>`)
      ].join("");

      categorySelect.value = state.category;
      brandSelect.value = state.brand;
      resolutionSelect.value = state.resolution;
    }

    function filterProducts(){
      return products.filter(p => {
        const query = state.query.toLowerCase();
        const haystack = `${p.name} ${p.category} ${p.brand} ${p.description} ${p.code}`.toLowerCase();

        return (
          (!state.category || p.category === state.category) &&
          (!state.brand || p.brand === state.brand) &&
          (!state.resolution || p.resolution === state.resolution) &&
          (!query || haystack.includes(query))
        );
      });
    }

    function renderCatalog(){
      const catalogEl = document.getElementById("catalog");
      const rows = filterProducts();

      if (!rows.length) {
        catalogEl.innerHTML = '<div class="empty">Sin coincidencias.</div>';
        return;
      }

      catalogEl.innerHTML = rows.map(p => `
        <article class="card">
          <div class="card-media">
            <span>${p.code}</span>
            <img
              src="${p.img}"
              alt="${p.name}"
              loading="lazy"
              decoding="async"
              style="object-position:${p.crop || 'center'};"
            />
          </div>
          <div class="meta">${p.category} · ${p.brand}</div>
          <div class="name">${p.name}</div>
          <div class="code">Código: ${p.code}</div>
          <div class="desc">${p.description}</div>
          <div class="small">Stock: ${p.stock}</div>
          <div class="price">${money(priceWithIncrease(p.cost))}</div>
          <div class="small">Precio de venta + IVA</div>
          <div class="row">
            <button type="button" data-code="${p.code}">Consultar por WhatsApp</button>
          </div>
        </article>
      `).join("");

      catalogEl.querySelectorAll(".card-media img").forEach((img) => {
        const markMissing = () => img.parentElement.classList.add("is-missing");
        img.addEventListener("error", markMissing);
        if (img.complete && img.naturalWidth === 0) markMissing();
      });
    }

    document.getElementById("catalog").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-code]");
      if (!button) return;

      const product = products.find((item) => item.code === button.dataset.code);
      if (!product) return;

      const price = money(priceWithIncrease(product.cost));
      const text = "Hola, IPE3 Engineering. Me interesa el producto " +
        product.code + " (" + product.name + ") que aparece en " + price +
        ". Quiero confirmar disponibilidad y el precio final.";

      window.open(
        "https://wa.me/593984016027?text=" + encodeURIComponent(text),
        "_blank",
        "noopener"
      );
    });

    document.getElementById("categoryFilter").addEventListener("change", (e) => {
      state.category = e.target.value;
      state.brand = "";
      state.resolution = "";
      renderFilters();
      renderCatalog();
    });

    document.getElementById("brandFilter").addEventListener("change", (e) => {
      state.brand = e.target.value;
      state.resolution = "";
      renderFilters();
      renderCatalog();
    });

    document.getElementById("resolutionFilter").addEventListener("change", (e) => {
      state.resolution = e.target.value;
      renderCatalog();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      state.query = e.target.value;
      renderCatalog();
    });

    renderFilters();
    renderCatalog();
  </script>
</body>
</html>
